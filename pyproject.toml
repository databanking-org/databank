[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "databank"
version = "0.1.0"
description = "Reference implementation of a bit-scarce, sandboxed Databank query"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Dan Protopopescu" }]
keywords = ["privacy", "data-protection", "databanking", "minimal-disclosure"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://databanking.org"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
